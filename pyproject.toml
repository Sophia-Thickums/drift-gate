[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-gate"
version = "0.1.0"
description = "Catch an AI agent drifting into generic assistant voice before the reply ships."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sophia Marie DeClue"}]

[project.urls]
Homepage = "https://github.com/Sophia-Thickums/drift-gate"

[tool.setuptools]
py-modules = ["drift_gate"]
